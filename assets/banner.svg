<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dash {
      to {
        stroke-dashoffset: -100;
      }
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .event-line {
      stroke-dasharray: 8, 12;
      animation: dash 3s linear infinite;
    }
    .pulsing-dot {
      animation: pulse-node 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-pill-1 {
      animation: float-pill 4s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: float-pill 4s ease-in-out 2s infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Decorative Grid Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="420" fill="url(#grid)" />
  </g>

  <!-- Animated Dynamic Event Bus Lines (Background Layer) -->
  <g opacity="0.4">
    <!-- Curved Event Stream Lines -->
    <path d="M 100 80 Q 300 20 600 80 T 1100 80" fill="none" stroke="#38bdf8" stroke-width="2" class="event-line" />
    <path d="M 80 340 Q 400 400 700 340 T 1120 340" fill="none" stroke="#a855f7" stroke-width="2" class="event-line" />
    <path d="M 150 210 Q 500 120 900 210 T 1050 210" fill="none" stroke="#ec4899" stroke-width="1.5" class="event-line" />
  </g>

  <!-- Decorative Glowing Architecture Nodes (Background Layer) -->
  <g opacity="0.6">
    <circle cx="200" cy="90" r="6" fill="#38bdf8" class="pulsing-dot" filter="url(#glow)" />
    <circle cx="600" cy="80" r="8" fill="#8b5cf6" class="pulsing-dot" filter="url(#glow)" />
    <circle cx="1000" cy="90" r="6" fill="#ec4899" class="pulsing-dot" filter="url(#glow)" />
    <circle cx="350" cy="350" r="7" fill="#06b6d4" class="pulsing-dot" filter="url(#glow)" />
    <circle cx="850" cy="330" r="6" fill="#a855f7" class="pulsing-dot" filter="url(#glow)" />
  </g>

  <!-- Floating Dynamic Feature Pills (Left & Right Sides) -->
  <g class="floating-pill-1">
    <rect x="70" y="150" width="160" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="150" y="173" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ EventBus</text>
  </g>

  <g class="floating-pill-2">
    <rect x="970" y="150" width="160" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.9" />
    <text x="1050" y="173" text-anchor="middle" class="badge-text" fill="#c084fc">🔄 Pub / Sub</text>
  </g>

  <g class="floating-pill-2">
    <rect x="90" y="240" width="170" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" opacity="0.9" />
    <text x="175" y="263" text-anchor="middle" class="badge-text" fill="#f472b6">☁️ Serverless</text>
  </g>

  <g class="floating-pill-1">
    <rect x="950" y="240" width="180" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
    <text x="1040" y="263" text-anchor="middle" class="badge-text" fill="#34d399">📦 Open-Source</text>
  </g>

  <!-- FOREGROUND CONTENT - HIGH CONTRAST & CLEAR VISIBILITY -->
  <!-- Top Category Tag -->
  <rect x="425" y="55" width="350" height="32" rx="16" fill="url(#accent-cyan)" opacity="0.25" />
  <rect x="425" y="55" width="350" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1" />
  <text x="600" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#38bdf8">CURATED ECOSYSTEM GUIDE</text>

  <!-- Main Title -->
  <text x="600" y="155" text-anchor="middle" class="title-text" font-size="38" letter-spacing="-0.5">
    Awesome Serverless Event Bus
  </text>
  <text x="600" y="205" text-anchor="middle" class="title-text" font-size="32" fill="#a855f7" letter-spacing="-0.5">
    &amp; Event-Driven Architecture
  </text>

  <!-- Subtitle -->
  <text x="600" y="260" text-anchor="middle" class="subtitle-text" font-size="17">
    Commercial SaaS Event Routers, Distributed Event Streaming &amp; Cloud-Native Queues
  </text>

  <!-- Bottom Tech Stack Icons / Badges Ribbon -->
  <g transform="translate(300, 310)">
    <rect x="0" y="0" width="600" height="44" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1" />
    
    <text x="50" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">AWS EventBridge</text>
    <circle cx="160" cy="22" r="3" fill="#64748b" />
    
    <text x="190" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Apache Kafka</text>
    <circle cx="300" cy="22" r="3" fill="#64748b" />

    <text x="330" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Redpanda</text>
    <circle cx="410" cy="22" r="3" fill="#64748b" />

    <text x="440" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">NATS JetStream</text>
  </g>

</svg>
